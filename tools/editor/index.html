<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRAVANA — Local Authoring Demo</title>
  <style>
    :root {
      --ink: #140d19;
      --accent: #c296eb;
      --paper: #f6f6f6;
      --line: #d8d2de;
      --muted: #6f6679;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      color: var(--ink);
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }

    button, input, textarea { font: inherit; }

    .sidebar {
      width: 270px;
      flex: 0 0 270px;
      background: var(--ink);
      color: #fff;
      padding: 22px 18px;
      overflow-y: auto;
    }

    .brand {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 24px;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .brand span {
      display: block;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-top: 4px;
    }

    .note {
      color: #b9b1c2;
      font-size: 12px;
      line-height: 1.5;
      margin: 14px 0 20px;
    }

    .note code {
      color: #fff;
      background: rgb(255 255 255 / 10%);
      padding: 1px 4px;
    }

    .page-list {
      display: grid;
      gap: 4px;
    }

    .page-link {
      text-align: left;
      border: 0;
      background: transparent;
      color: #d8d2de;
      padding: 9px 10px;
      cursor: pointer;
      border-left: 3px solid transparent;
    }

    .page-link:hover { background: rgb(255 255 255 / 8%); color: #fff; }
    .page-link.active { border-left-color: var(--accent); background: rgb(194 150 235 / 16%); color: #fff; }

    .main {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px 64px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }

    .topbar h1 {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 30px;
      font-weight: 400;
    }

    .muted { color: var(--muted); font-size: 12px; margin: 4px 0 0; }

    .actions { display: flex; gap: 8px; align-items: center; }

    .button {
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      padding: 9px 14px;
      cursor: pointer;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .button.primary { background: var(--ink); color: #fff; }
    .button.primary:hover { background: #3b264c; border-color: #3b264c; }
    .button.secondary:hover { background: var(--ink); color: #fff; }

    .status {
      min-height: 20px;
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .status.dirty { color: #8a4b00; }
    .status.saved { color: #1f6b3a; }
    .status.error { color: #b00020; }

    .section-card {
      background: #fff;
      border: 1px solid var(--line);
      margin-bottom: 18px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      background: #efeaf3;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .section-header code {
      color: var(--ink);
      text-transform: none;
      letter-spacing: 0;
      background: #fff;
      padding: 1px 5px;
    }

    .block-card {
      border-top: 1px solid var(--line);
      padding: 14px;
    }

    .block-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .block-head strong {
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .mini {
      border: 1px solid var(--line);
      background: #fff;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 11px;
    }

    .mini:hover { border-color: var(--ink); }

    .block-row {
      position: relative;
      display: flex;
      gap: 10px;
      border: 1px dashed var(--line);
      padding: 10px;
      margin-bottom: 8px;
      background: #fcfbfd;
    }

    .block-row > .cell { flex: 1 1 0; min-width: 0; }

    .remove {
      position: absolute;
      right: -8px;
      top: -8px;
      width: 22px;
      height: 22px;
      border: 1px solid var(--line);
      background: #fff;
      color: #b00020;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
    }

    .cell {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .cell-el {
      display: grid;
      gap: 4px;
    }

    .cell-el > .tag {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .editable {
      min-height: 28px;
      border: 1px solid transparent;
      padding: 6px 8px;
      background: #fff;
      overflow-wrap: break-word;
    }

    .editable:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgb(194 150 235 / 25%);
    }

    .editable img { max-width: 100%; height: auto; display: block; }

    .media-editor, .link-editor {
      display: grid;
      gap: 4px;
      padding: 6px;
      background: #f3eef8;
      border: 1px solid var(--line);
    }

    .media-editor img {
      width: 100%;
      max-height: 110px;
      object-fit: cover;
      background: #fff;
    }

    .media-editor input, .link-editor input {
      width: 100%;
      border: 1px solid var(--line);
      padding: 5px 7px;
      background: #fff;
      font-size: 12px;
    }

    .default-card {
      padding: 10px 14px;
      border-top: 1px solid var(--line);
    }

    .default-card .tag {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .default-card .editable {
      border-color: var(--line);
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">PRAVANA <span>Local authoring demo</span></div>
    <p class="note">
      Stand-in for Experience Workspace. Edits write to
      <code>content/*.plain.html</code>; the demo at
      <code>localhost:3000</code> reloads.
    </p>
    <nav id="page-list" class="page-list"></nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">Loading…</h1>
        <p id="page-path" class="muted"></p>
      </div>
      <div class="actions">
        <a id="preview" class="button secondary" target="_blank" rel="noopener">Preview</a>
        <button id="revert" class="button secondary" type="button">Revert</button>
        <button id="save" class="button primary" type="button">Save</button>
      </div>
    </header>
    <div id="status" class="status" role="status"></div>
    <div id="editor"></div>
  </main>

  <script>
    const BLOCKS = new Set([
      'hero-video', 'product-slider', 'cards', 'form', 'product-gallery',
      'product-features', 'accordion', 'distributor-links', 'reviews',
      'callout', 'video', 'event-detail', 'page-intro', 'faq', 'metadata',
    ]);

    const state = {
      pages: [],
      page: null,
      doc: null,
      path: null,
      route: null,
      dirty: false,
    };

    const els = {
      pageList: document.getElementById('page-list'),
      title: document.getElementById('page-title'),
      path: document.getElementById('page-path'),
      editor: document.getElementById('editor'),
      status: document.getElementById('status'),
      save: document.getElementById('save'),
      revert: document.getElementById('revert'),
      preview: document.getElementById('preview'),
    };

    let demoUrl = 'http://localhost:3000';

    function setStatus(message, kind = '') {
      els.status.textContent = message;
      els.status.className = `status ${kind}`.trim();
    }

    function markDirty() {
      state.dirty = true;
      setStatus('Unsaved changes', 'dirty');
    }

    function isBlock(el) {
      return [...el.classList].some((c) => BLOCKS.has(c));
    }

    function imageEditor(img) {
      const wrap = document.createElement('div');
      wrap.className = 'media-editor';

      const rawSrc = img.getAttribute('src') || '';
      const preview = document.createElement('img');
      preview.src = rawSrc.startsWith('/') ? `${demoUrl}${rawSrc}` : rawSrc;
      preview.alt = img.alt;

      const url = document.createElement('input');
      url.type = 'url';
      url.value = rawSrc;
      url.placeholder = 'Image URL';

      const alt = document.createElement('input');
      alt.type = 'text';
      alt.value = img.alt;
      alt.placeholder = 'Alt text';

      url.addEventListener('input', () => {
        img.setAttribute('src', url.value);
        preview.src = url.value.startsWith('/') ? `${demoUrl}${url.value}` : url.value;
        markDirty();
      });
      alt.addEventListener('input', () => {
        img.alt = alt.value;
        preview.alt = alt.value;
        markDirty();
      });

      wrap.append(preview, url, alt);
      return wrap;
    }

    function linkEditor(link) {
      const wrap = document.createElement('div');
      wrap.className = 'link-editor';

      const url = document.createElement('input');
      url.type = 'url';
      url.value = link.getAttribute('href') || '';
      url.placeholder = 'Link URL';
      url.addEventListener('input', () => {
        link.setAttribute('href', url.value);
        markDirty();
      });

      wrap.append(url);
      return wrap;
    }

    function textNodeEditor(node) {
      const editable = document.createElement('div');
      editable.className = 'editable';
      editable.contentEditable = 'true';
      editable.textContent = node.textContent;
      editable.addEventListener('input', () => {
        node.textContent = editable.textContent;
        markDirty();
      });
      return editable;
    }

    function elementEditor(el) {
      const card = document.createElement('div');
      card.className = 'cell-el';

      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = el.tagName.toLowerCase();
      card.append(tag);

      if (el.tagName === 'IMG') {
        card.append(imageEditor(el));
        return card;
      }

      if (el.tagName === 'A') {
        card.append(linkEditor(el));
      }

      const editable = document.createElement('div');
      editable.className = 'editable';
      editable.contentEditable = 'true';
      editable.innerHTML = el.innerHTML;
      editable.addEventListener('input', () => {
        el.innerHTML = editable.innerHTML;
        markDirty();
      });
      card.append(editable);

      const img = el.querySelector('img');
      if (img) card.append(imageEditor(img));

      const link = el.querySelector('a');
      if (link) card.append(linkEditor(link));

      return card;
    }

    function renderCell(cell) {
      const wrap = document.createElement('div');
      wrap.className = 'cell';

      const nodes = [...cell.childNodes];
      const hasElement = nodes.some((node) => node.nodeType === 1);

      if (!hasElement) {
        const editable = document.createElement('div');
        editable.className = 'editable';
        editable.contentEditable = 'true';
        editable.textContent = cell.textContent;
        editable.addEventListener('input', () => {
          cell.textContent = editable.textContent;
          markDirty();
        });
        wrap.append(editable);
        return wrap;
      }

      nodes.forEach((node) => {
        if (node.nodeType === 3 && node.textContent.trim()) {
          wrap.append(textNodeEditor(node));
        } else if (node.nodeType === 1) {
          wrap.append(elementEditor(node));
        }
      });

      return wrap;
    }

    function renderRow(row) {
      const rowEl = document.createElement('div');
      rowEl.className = 'block-row';

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'remove';
      remove.title = 'Remove row';
      remove.textContent = '×';
      remove.addEventListener('click', () => {
        row.remove();
        rowEl.remove();
        markDirty();
      });

      rowEl.append(remove);
      [...row.children].forEach((cell) => rowEl.append(renderCell(cell)));
      return rowEl;
    }

    function addRow(block, card) {
      const last = block.lastElementChild;
      if (!last) return;
      const clone = last.cloneNode(true);
      block.append(clone);
      card.append(renderRow(clone));
      markDirty();
    }

    function renderBlock(block) {
      const card = document.createElement('div');
      card.className = 'block-card';

      const head = document.createElement('div');
      head.className = 'block-head';

      const title = document.createElement('strong');
      title.textContent = [...block.classList].find((c) => BLOCKS.has(c)) || block.className;

      const add = document.createElement('button');
      add.type = 'button';
      add.className = 'mini';
      add.textContent = '+ Add row';
      add.addEventListener('click', () => addRow(block, card));

      head.append(title, add);
      card.append(head);

      [...block.children].forEach((row) => card.append(renderRow(row)));
      return card;
    }

    function renderDefault(el) {
      const card = document.createElement('div');
      card.className = 'default-card';

      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = el.tagName.toLowerCase();
      card.append(tag);

      if (el.tagName === 'IMG') {
        card.append(imageEditor(el));
        return card;
      }

      const img = el.querySelector('img');
      if (img) card.append(imageEditor(img));

      const link = el.querySelector('a');
      if (link) card.append(linkEditor(link));

      const editable = document.createElement('div');
      editable.className = 'editable';
      editable.contentEditable = 'true';
      editable.innerHTML = el.innerHTML;
      editable.addEventListener('input', () => {
        el.innerHTML = editable.innerHTML;
        markDirty();
      });

      card.append(editable);
      return card;
    }

    function renderEditor() {
      els.editor.innerHTML = '';
      if (!state.doc) return;

      const sections = [...state.doc.children];
      if (!sections.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No content found in this document.';
        els.editor.append(empty);
        return;
      }

      sections.forEach((section, index) => {
        const card = document.createElement('section');
        card.className = 'section-card';

        const header = document.createElement('div');
        header.className = 'section-header';
        header.innerHTML = `<span>Section ${index + 1}</span><code>${section.className || ''}</code>`;
        card.append(header);

        [...section.children].forEach((child) => {
          if (isBlock(child)) card.append(renderBlock(child));
          else card.append(renderDefault(child));
        });

        els.editor.append(card);
      });
    }

    function renderPageList() {
      els.pageList.innerHTML = '';
      state.pages.forEach((page) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'page-link';
        button.textContent = page.name;
        if (state.page && page.path === state.page.path) button.classList.add('active');
        button.addEventListener('click', () => loadPage(page));
        els.pageList.append(button);
      });
    }

    async function loadPage(page) {
      if (state.dirty && !window.confirm('Discard unsaved changes?')) return;
      setStatus('Loading…');
      try {
        const response = await fetch(`/api/content?path=${encodeURIComponent(page.path)}`);
        if (!response.ok) throw new Error(`Could not load ${page.path}`);
        const html = await response.text();
        const doc = document.createElement('div');
        doc.innerHTML = html;
        state.doc = doc;
        state.page = page;
        state.path = page.path;
        state.route = page.route;
        state.dirty = false;

        els.title.textContent = page.name;
        els.path.textContent = page.path;
        els.preview.href = `${demoUrl}${page.route}`;

        renderPageList();
        renderEditor();
        setStatus('Loaded. Edit any field, then Save.');
      } catch (error) {
        setStatus(error.message, 'error');
      }
    }

    async function save() {
      if (!state.path) return;
      setStatus('Saving…');
      try {
        const response = await fetch(`/api/content?path=${encodeURIComponent(state.path)}`, {
          method: 'POST',
          body: state.doc.innerHTML,
        });
        if (!response.ok) throw new Error('Save failed');
        state.dirty = false;
        setStatus('Saved. The demo preview reloads automatically.', 'saved');
      } catch (error) {
        setStatus(error.message, 'error');
      }
    }

    async function init() {
      try {
        const response = await fetch('/api/pages');
        const data = await response.json();
        state.pages = data.pages || [];
        demoUrl = data.demoUrl || demoUrl;
        renderPageList();
        const home = state.pages.find((p) => p.name === 'Homepage') || state.pages[0];
        if (home) await loadPage(home);
        else setStatus('No content files found.', 'error');
      } catch (error) {
        setStatus(error.message, 'error');
      }
    }

    els.save.addEventListener('click', save);
    els.revert.addEventListener('click', () => state.page && loadPage(state.page));
    document.addEventListener('keydown', (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') {
        event.preventDefault();
        save();
      }
    });

    init();
  </script>
</body>
</html>
